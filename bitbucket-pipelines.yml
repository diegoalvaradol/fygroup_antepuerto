image: composer:2.0

pipelines:
  default:
    - parallel:
        - step:
            name: Test
            script:
              - composer install
              - ./vendor/bin/phpunit test
            caches:
              - composer

        - step:
            name: Lint
            script:
              - composer install
              - ./vendor/bin/phplint . --exclude=vendor
            caches:
              - composer

  branches:
    master:
      - step:
          name: Deploy a FTP (SSL-CHILE)
          deployment: production
          script:
            - apt-get update && apt-get install -y lftp
            - lftp -c "open -u $FTP_USER,$FTP_PASSWORD $FTP_HOST; mirror -R ./ /public_html/ssl-chile --delete --verbose --exclude .git --exclude node_modules --exclude vendor --exclude bitbucket-pipelines.yml; quit"